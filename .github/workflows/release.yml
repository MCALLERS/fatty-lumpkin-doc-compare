name: Build installers

# Push a tag like v1.0.0 to produce Mac + Windows installers and attach them to
# a GitHub Release. The download page links to /releases/latest/download/<file>,
# so the links never need editing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A real launch of the real app: two documents in, a .docx and a .pdf on disk.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Install Playwright
        run: npm i -D playwright@1.49.0 --no-audit --no-fund
      - name: Engine tests
        working-directory: app
        run: npm test
      - name: End-to-end launch
        run: xvfb-run -a node qa/smoke-electron.mjs

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run engine tests
        working-directory: app
        run: npm test

      - name: Build installer (macOS)
        if: matrix.name == 'mac'
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Build installer (Windows)
        if: matrix.name == 'win'
        working-directory: app
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          generate_release_notes: true
          body: |
            **Fatty Lumpkin Doc Compare ${{ github.ref_name }}**

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Fatty-Lumpkin-Doc-Compare-*-arm64.dmg` |
            | macOS (Intel) | `Fatty-Lumpkin-Doc-Compare-*-x64.dmg` |
            | Windows 10/11 | `Fatty-Lumpkin-Doc-Compare-Setup-*.exe` |

            These builds are not code-signed. Installation instructions are on the
            download page: https://redline.bombadillo-ai.com
